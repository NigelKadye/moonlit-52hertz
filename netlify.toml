[build]
command = "pnpm build:client || npm run build:client"
functions = "netlify/functions"
publish = "dist/spa"

[build.environment]
NODE_VERSION = "22"
PNPM_VERSION = "10"

[functions]
external_node_modules = ["express"]
node_bundler = "esbuild"

[[redirects]]
force = true
from = "/api/*"
status = 200
to = "/.netlify/functions/api/:splat"

[[redirects]]
from = "/*"
status = 200
to = "/index.html"
